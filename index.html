<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Anima Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="style.css" rel="stylesheet" />
</head>

<body>
  <div class="landing-page">
    <div class="blur-background-1"></div>
    <div class="white-background"></div>
    <div class="nd-background"></div>

    <img class="logo-image" alt="Logo" src="frontend/assets/logo2.png" />

    <h1 class="header-text">
      hey this is
    </h1>

    <h2 class="subheader-text">
      how can i help you today.?
    </h2>

    <button class="button start-talking-button">
      start talking
    </button>

    <div class="action-buttons-container">
      <button class="button action-button">view history</button>
      <button class="button action-button">check score</button>
      <button class="button action-button">friends</button>
    </div>

    <img class="microphone-icon" alt="Microphone no bg" src="frontend/assets/microphone_no_bg.png" />

    <header class="page-header"></header>

    <div class="hamburger">
      <label class="bar" for="check">
        <input type="checkbox" id="check">

        <span class="top"></span>
        <span class="middle"></span>
        <span class="bottom"></span>
      </label>
    </div>
  </div>
</body>

</html>
